<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>SzAi Chat Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  
  <div style="text-align:center; padding-top:100px; color:#333; font-family:'Inter', sans-serif;">
    <h1>SzAi Internal Portal</h1>
    <p>Click the button below to start.</p>
  </div>

  <div id="sz-chat-widget-container">
    
    <button class="sz-chat-btn" id="sz-toggle-btn">
      <div class="sz-btn-icon">
        <img src="{{ url_for('static', filename='images/bot_icon.png') }}" class="sz-btn-img" alt="Bot">
      </div>
      <span class="sz-btn-text">Ask SzAi</span>
    </button>

    <div class="sz-chat-box" id="sz-chat-box">
      <div class="sz-chat-header">
        <div class="sz-header-left">
          <div class="sz-avatar-wrap">
            <img src="{{ url_for('static', filename='images/bot_icon.png') }}" 
                 class="sz-header-img" alt="Bot">
            <div class="sz-status-dot"></div>
          </div>
          <div class="sz-header-info">
            <h3>SzAi</h3>
            <span class="sz-status-text">Online</span>
          </div>
        </div>
        
        <div class="sz-header-actions">
          <button class="sz-icon-btn" id="sz-clear-chat" title="Clear Chat">
            <i class="fa-solid fa-eraser"></i>
          </button>
          <button class="sz-icon-btn" id="sz-close-chat" title="Minimize">
            <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>
      </div>

      <div class="sz-chat-body" id="sz-chat-body"></div>

      <div class="sz-chat-footer">
        <div class="sz-input-container">
          <input type="text" class="sz-chat-input" id="sz-input" placeholder="Type a message..." autocomplete="off">
          <button class="sz-send-btn" id="sz-send">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="sz-modal" aria-hidden="true">
    <div id="sz-modal-backdrop"></div>

    <div id="sz-video-popup">
      <button id="sz-modal-close" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="sz-video-stage">
        <video id="sz-popup-video" playsinline></video>
        <button id="sz-center-play">
          <i class="fa-solid fa-play"></i>
        </button>
      </div>

      <div id="sz-controls">
        <div id="sz-progress-wrap">
          <div id="sz-progress">
            <div id="sz-progress-buffer"></div>
            <div id="sz-progress-played"></div>
          </div>
          <div id="sz-progress-tooltip">0:00</div>
        </div>

        <div id="sz-controls-row">
          <div class="left-group">
            <button class="ctrl" id="sz-playpause" title="Play/Pause">
              <i class="fa-solid fa-play"></i>
            </button>
            <span class="sz-divider"></span>
            <button class="ctrl" id="sz-rewind" title="Rewind 10s">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button class="ctrl" id="sz-forward" title="Forward 10s">
              <i class="fa-solid fa-rotate-right"></i>
            </button>
            <div id="sz-time">0:00 / 0:00</div>
          </div>

          <div class="right-group">
            <div class="vol-container">
              <button class="ctrl" id="sz-mute" title="Mute">
                <i class="fa-solid fa-volume-high"></i>
              </button>
              <input id="sz-vol" type="range" min="0" max="1" step="0.05" value="1">
            </div>
            
            <button class="ctrl" id="sz-pip" title="Picture in Picture">
              <i class="fa-solid fa-clone"></i>
            </button>
            <button class="ctrl" id="sz-full" title="Fullscreen">
              <i class="fa-solid fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="sz-image-modal">
    <span class="sz-close-img">&times;</span>
    
    <div class="sz-img-view-container">
      <img class="sz-modal-content" id="sz-full-image">
    </div>

    <div class="sz-img-controls">
      <button id="sz-zoom-out"><i class="fa-solid fa-minus"></i></button>
      <button id="sz-zoom-reset"><i class="fa-solid fa-expand"></i></button>
      <button id="sz-zoom-in"><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
