<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saazvat Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="title">
                <h3>SzAi</h3>
                <p>Online | HR Support</p>
            </div>
        </div>

        <div id="messageFormeight" class="card-body msg_card_body">
            </div>

        <div class="card-footer">
            <form id="messageArea" class="input-group">
                <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
                <div class="input-group-append">
                    <button type="submit" id="send" class="input-group-text send_btn">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        
        <div class="zoom-controls">
            <button onclick="zoomOut()" title="Zoom Out"><i class="fas fa-minus"></i></button>
            <button onclick="zoomIn()" title="Zoom In"><i class="fas fa-plus"></i></button>
            <button onclick="resetZoom()" title="Reset"><i class="fas fa-compress"></i></button>
        </div>

        <div class="modal-content-container">
            <img class="modal-content" id="img01">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
